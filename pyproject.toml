[project]
name = "gql-scanner"
version = "0.1.0"
description = "Deterministic black-box GraphQL security scanner (OWASP GraphQL Cheat Sheet)"
readme = "README.md"
authors = [
    { name = "viky", email = "vikychoi@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "graphql-core>=3.2",
    "rich>=13",
]

[project.scripts]
gql-scanner = "gql_scanner.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-httpserver>=1.1",
    "mypy>=1.10",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gql_scanner"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# B008: typer uses calls (typer.Option(...)) in argument defaults by design.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# typer option declarations are intentionally long, one per line.
"src/gql_scanner/cli.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
